name: Transport contracts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owner-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: owebeeone/taut
          ref: bcf98b64d465fc54841121b6d1a2d46940f81a3c
          path: .taut-generator
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install generator and exact formatter toolchain
        run: |
          python -m pip install taut-proto==0.9.1
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt
          rustup default 1.96.0
          rustup toolchain install 1.95.0 --profile minimal
      - name: Verify generated artifacts without rewriting them
        run: |
          PYTHONPATH=scripts python -m unittest discover -s scripts -p 'test_*.py'
          python scripts/regen.py --check --taut-source .taut-generator/src
          cargo fmt --all -- --check
      - name: Test contracts and deterministic replay at the MSRV
        run: cargo +1.95.0 test --locked
      - name: Verify the standalone package
        run: cargo +1.95.0 package --locked
